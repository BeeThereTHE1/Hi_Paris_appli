<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Playground — Catalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/login_with_catalog.css" />
</head>

<body>

  <iframe class="video-background"
    src="https://www.youtube.com/embed/ZNJJ3wEmRb8?autoplay=1&mute=1&loop=1&playlist=ZNJJ3wEmRb8&controls=0&showinfo=0"
    frameborder="0" allow="autoplay; fullscreen"></iframe>

  <!-- ── HEADER ── -->
  <header>
    <a class="header-brand" href="../index.html">
      <div class="brand-icon">
        <img src="Image/logo_f.png" style="width: 100%; height: 100%; border-radius: 10%; object-fit: contain;"
          alt="Logo">
      </div>
      <span class="brand-name">Neural Playground</span>
    </a>

    <div class="header-right">
      <a class="btn-back" href="#"
        onclick="event.preventDefault(); window.location.href = localStorage.getItem('isLoggedIn') === 'true' ? '../index.html' : '../index.html';">
        <span class="material-icons" style="font-size: 18px;">home</span> Main page
      </a>

      <div class="header-right">
        <div id="widget-profil-header" style="margin-left: 20px;"></div>
      </div>
    </div>
  </header>

  <!-- WIDGET PROFILE IN HEADER -->
  <script>
    (function () {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const user = (() => {
        try {
          return JSON.parse(localStorage.getItem('currentUser'));
        } catch {
          return null;
        }
      })();

      const container = document.getElementById('widget-profil-header');
      if (!container) return;

      container.style.cssText = 'position: relative; font-family: "Inter", sans-serif; perspective: 1000px; display: flex; align-items: center;';

      if (!isLoggedIn || !user) {
        const visitorBtn = document.createElement('a');
        visitorBtn.href = 'register.html';
        visitorBtn.style.cssText = 'display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05); padding:6px 12px; border-radius:50px; color:#fff; text-decoration:none;';
        visitorBtn.onmouseover = () => visitorBtn.style.boxShadow = '0 0 25px rgba(139,92,246,0.6)';
        visitorBtn.onmouseout = () => visitorBtn.style.boxShadow = '0 0 15px rgba(139,92,246,0.2)';
        visitorBtn.innerHTML = '<div style="background:linear-gradient(135deg, #8b5cf6, #3b82f6); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;">👋</div><span style="font-size:13px; color:#fff; font-weight:600;">Sign up</span>';
        container.appendChild(visitorBtn);
        return;
      }

      const initiales = (user.prenom ? user.prenom[0] : '') + (user.nom ? user.nom[0] : '');

      const avatar = document.createElement('div');
      avatar.style.cssText = 'width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #3b82f6); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; cursor: pointer; transition: transform .18s;';
      avatar.innerText = initiales.toUpperCase();

      avatar.onmouseover = () => avatar.style.transform = 'scale(1.1) rotate(5deg)';
      avatar.onmouseout = () => avatar.style.transform = 'scale(1) rotate(0deg)';

      const menu = document.createElement('div');
      menu.style.cssText = 'display: none; position: absolute; top: 60px; right: 0; width: 260px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); border: 1px solid rgba(148,163,184,0.08); border-radius: 12px; padding: 6px; box-shadow: 0 10px 30px rgba(2,6,23,0.6); opacity:0; transform:scale(0.95) translateY(-6px); transition: all .18s; pointer-events: none; z-index: 9999;';

      const p = user.profil || user.profile || user.role || 'étudiant';
      const typeProfil = p.charAt(0).toUpperCase() + p.slice(1);

      menu.innerHTML = `
        <div style="padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.03);">
          <div style="font-size:16px; font-weight:800; color:#fff;">${user.prenom || ''} ${user.nom || ''}</div>
          <div style="font-size:12px; color:#94a3b8; margin-top:4px;">${user.email || ''}</div>
          <div style="display:inline-block; margin-top:8px; padding:4px 10px; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.22); border-radius:20px; font-size:12px; color:#10b981;">${typeProfil}</div>
        </div>
        <div style="padding: 8px;">
          <a href="historique.html" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; color:#e2e8f0; text-decoration:none; font-size:14px;">📊 My History</a>
          <a href="../statsetudiant.html" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; color:#e2e8f0; text-decoration:none; font-size:14px;">📈 Statistics</a>
          <div id="btnFuturLogout" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; color:#f87171; font-size:14px; cursor:pointer;">🚪 Logout</div>
        </div>
      `;

      let isOpen = false;
      avatar.onclick = () => {
        isOpen = !isOpen;
        if (isOpen) {
          menu.style.display = 'block';
          setTimeout(() => {
            menu.style.opacity = '1';
            menu.style.transform = 'scale(1) translateY(0)';
            menu.style.pointerEvents = 'auto';
          }, 10);
        } else {
          menu.style.opacity = '0';
          menu.style.transform = 'scale(0.9) translateY(-10px)';
          menu.style.pointerEvents = 'none';
          setTimeout(() => menu.style.display = 'none', 300);
        }
      };

      menu.querySelector('#btnFuturLogout').onclick = () => {
        localStorage.removeItem('isLoggedIn');
        window.location.href = '../index.html';
      };

      document.addEventListener('click', (e) => {
        if (!container.contains(e.target) && isOpen) avatar.onclick();
      });

      container.appendChild(avatar);
      container.appendChild(menu);
    })();
  </script>

  <!-- FIN WIDGET PROFIL -->


  <!-- Arrière-plan -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Carte principale -->
  <div class="card" role="main">

    <!-- Logo -->
    <div class="logo">
      <img src="Image/logo_f.png" style="width: 100%; height: auto; border-radius: 12px; margin-bottom: 20px;"
        alt="Logo">
      <div class="logo-title">Hi! Paris Playground For Deep Neural Network</div>
    </div>

    <!-- SECTION : CATALOGUE (Visible) -->
    <div id="section-catalog" style="display: block;">
      <!-- Séparateur -->
      <div class="sep">
        <div class="sep-line"></div>
        <span class="sep-txt">What do you want to do??</span>
        <div class="sep-line"></div>
      </div>

      <!-- Rectangles cliquables -->
      <div class="ex-grid">

        <!-- Choisir un exercice -->
        <div class="ex-card" id="ex-choose" role="button" tabindex="0" onclick="onCard('choose')"
          onkeydown="if(event.key==='Enter'||event.key===' ')onCard('choose')">
          <div class="ex-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M9 11l3 3L22 4" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
          </div>
          <div class="ex-title">Choose an<br>exercise</div>
          <div class="ex-desc">Browse the exercise library</div>
        </div>

        <!-- Create an exercise -->
        <div class="ex-card" id="ex-create" role="button" tabindex="0" onclick="window.location.href='../create.html'"
          onkeydown="if(event.key==='Enter'||event.key===' ') window.location.href='../create.html'">
          <div class="ex-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </div>
          <div class="ex-title">Create an<br>exercise</div>
          <div class="ex-desc">Design your own exercise</div>
        </div>

        <!-- Catalogue -->
        <div class="ex-card" id="ex-catalog" role="button" tabindex="0" onclick="window.location.href='../catalog.html'"
          onkeydown="if(event.key==='Enter'||event.key===' ') window.location.href='../catalog.html'">
          <div class="ex-icon-wrap"
            style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);">
            <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M9 3v18" />
              <path d="M14 9h4" />
              <path d="M14 15h4" />
            </svg>
          </div>
          <div class="ex-title">Full<br>catalog</div>
          <div class="ex-desc">Consult the catalog</div>
        </div>

      </div>
    </div><!-- /card -->

    <script>
      /* ─── Toast ─── */
      function toast(msg, color = '#6ee7b7') {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.style.color = color;
        el.style.border = '1px solid ' + color + '55';
        el.style.background = color + '22';
        el.classList.add('show');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 3200);
      }

      /* ─── Cartes d'exercice ─── */
      function onCard(type) {
        const el = document.getElementById(type === 'choose' ? 'ex-choose' : 'ex-create');
        if (el) el.style.transform = 'scale(.93)';

        if (type === 'choose') {
          toast('📚 Ouverture from the library d\'exercices…', '#60a5fa');
          setTimeout(() => { window.location.href = 'exercises.html'; }, 400);
        }
      }
    </script>

    <!-- Ce script manage l'inactivité de l'utilisateur : il redirige vers la page d'accueil après 10 minutes d'inactivité -->
    <script src="../inactivite.js"></script>
</body>

</html>
