<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

</head>

<body>
  <!-- ===============================

  <style>
    .goog-te-gadget-simple { background-color: transparent !important; border: none !important; font-family: 'Inter', sans-serif !important; font-size: 14px !important; font-weight: 600 !important; }
    .goog-te-gadget-icon { display: none; }

    <img src="Image/hi.png"
        style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1;"
        alt="Background">

    <!-- ── HEADER ── -->
    <header>
        <a class="header-brand" href="../index.html">
            <div class="brand-icon">
                <img src="Image/logo_f.png" style="width: 100%; height: 100%; border-radius: 10%; object-fit: contain;"
                    alt="Logo">
            </div>
            <span class="brand-name">Neural Playground</span>
        </a>

        <div class="header-right">
            <a class="btn-back" href="#"
                onclick="event.preventDefault(); window.location.href = localStorage.getItem('isLoggedIn') === 'true' ? 'login_with_catalog.html' : '../index.html';">
                <span class="material-icons" style="font-size: 18px;">home</span> Page principale
            </a>

            <!-- <div class="header-right">
                <div id="widget-profil-header" style="margin-left: 20px;"></div>
            </div> -->
            
            <!-- Nouveau Widget Traduction intégré au header -->
            <div id="google_translate_element" style="display: none !important;"></div>
        </div>
    </header>

    <!-- WIDGET PROFIL FUTURISTE INTÉGRÉ AU HEADER -->
    <script>
        (function () {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const user = JSON.parse(localStorage.getItem('currentUser'));

            const container = document.getElementById('widget-profil-header');
            if (!container) return;

            container.style.cssText = 'position: relative; font-family: "Inter", sans-serif; perspective: 1000px; display: flex; align-items: center;';

            if (!isLoggedIn || !user) {
                const visitorBtn = document.createElement('a');
                visitorBtn.href = 'register.html';
                visitorBtn.style.cssText = 'display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05); padding:6px 20px 6px 6px; border-radius:50px; color:#fff; text-decoration:none; backdrop-filter:blur(20px); border:1px solid rgba(139,92,246,0.3); font-size:14px; box-shadow: 0 0 15px rgba(139,92,246,0.2); transition: 0.3s;';
                visitorBtn.onmouseover = () => visitorBtn.style.boxShadow = '0 0 25px rgba(139,92,246,0.6)';
                visitorBtn.onmouseout = () => visitorBtn.style.boxShadow = '0 0 15px rgba(139,92,246,0.2)';
                visitorBtn.innerHTML = '<div style="background:linear-gradient(135deg, #8b5cf6, #3b82f6); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 10px rgba(139,92,246,0.5);">👤</div> <span style="font-weight:600; letter-spacing:0.5px;">Vous n\'êtes pas connecté!</span>';
                container.appendChild(visitorBtn);
                return;
            }

            const initiales = (user.prenom ? user.prenom[0] : '') + (user.nom ? user.nom[0] : '');

            const avatar = document.createElement('div');
            avatar.style.cssText = 'width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #3b82f6); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: white; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4), inset 0 0 10px rgba(255,255,255,0.3); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);';
            avatar.innerText = initiales.toUpperCase();

            avatar.onmouseover = () => avatar.style.transform = 'scale(1.1) rotate(5deg)';
            avatar.onmouseout = () => avatar.style.transform = 'scale(1) rotate(0deg)';

            const menu = document.createElement('div');
            menu.style.cssText = 'display: none; position: absolute; top: 60px; right: 0; width: 260px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(25px); border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset; overflow: hidden; transform-origin: top right; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0; transform: scale(0.9) translateY(-10px); pointer-events: none;';

            const p = user.profil || user.profile || user.role || 'étudiant';
            const typeProfil = p.charAt(0).toUpperCase() + p.slice(1);

            menu.innerHTML = `
                <div style="padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); background: linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);">
                    <div style="font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.5px;">${user.prenom || ''} ${user.nom || ''}</div>
                    <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">${user.email || ''}</div>
                    <div style="display: inline-block; margin-top: 12px; padding: 4px 10px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 30px; font-size: 10px; font-weight: 700; color: #10b981; text-transform: uppercase; letter-spacing: 1px;">🟢 Profil ${typeProfil}</div>
                </div>
                <div style="padding: 8px;">
                    <a href="historique.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: #e2e8f0; text-decoration: none; font-size: 13px; font-weight: 600; transition: all 0.2s; cursor: pointer;" onmouseover="this.style.background='rgba(59, 130, 246, 0.1)'; this.style.color='#60a5fa'; this.style.transform='translateX(5px)';" onmouseout="this.style.background='transparent'; this.style.color='#e2e8f0'; this.style.transform='translateX(0)';">
                        <span style="font-size: 16px;">📊</span> Mon Historique
                    </a>
                    <div id="btnFuturLogout" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: #f87171; font-size: 13px; font-weight: 600; transition: all 0.2s; cursor: pointer; margin-top: 2px;" onmouseover="this.style.background='rgba(239, 68, 68, 0.1)'; this.style.transform='translateX(5px)';" onmouseout="this.style.background='transparent'; this.style.transform='translateX(0)';">
                        <span style="font-size: 16px;">🚪</span> Déconnexion
                    </div>
                </div>
            `;

            let isOpen = false;
            avatar.onclick = () => {
                isOpen = !isOpen;
                if (isOpen) {
                    menu.style.display = 'block';
                    setTimeout(() => {
                        menu.style.opacity = '1';
                        menu.style.transform = 'scale(1) translateY(0)';
                        menu.style.pointerEvents = 'auto';
                    }, 10);
                } else {
                    menu.style.opacity = '0';
                    menu.style.transform = 'scale(0.9) translateY(-10px)';
                    menu.style.pointerEvents = 'none';
                    setTimeout(() => menu.style.display = 'none', 300);
                }
            };

            menu.querySelector('#btnFuturLogout').onclick = () => {
                localStorage.removeItem('isLoggedIn');
                window.location.href = '../index.html';
            };

            document.addEventListener('click', (e) => {
                if (!container.contains(e.target) && isOpen) avatar.onclick();
            });

            container.appendChild(avatar);
            container.appendChild(menu);
        })();
    </script>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="toast" id="toast"></div>

    <div class="card">
        <div class="logo-title">Créer un compte</div>
        <div class="logo-sub">Rejoignez le Neural Playground</div>

        <form onsubmit="register(event)">

            <div class="row">
                <div class="field">
                    <label>Prénom</label>
                    <input type="text" id="prenom" placeholder="Ex: Ada" required>
                </div>
                <div class="field">
                    <label>Nom</label>
                    <input type="text" id="nom" placeholder="Ex: Lovelace" required>
                </div>
            </div>

            <div class="field">
                <label>Adresse Mail</label>
                <input type="email" id="email" placeholder="ada@exemple.com" required>
            </div>

            <div class="field">
                <label>Institution / École</label>
                <input type="text" id="ecole" placeholder="Ex: Hi! PARIS" required>
            </div>

            <div class="field">
                <label>Profil</label>
                <select id="profil" required onchange="toggleTokenField(this.value)">
                    <option value="" disabled selected>— Choisissez votre profil —</option>
                    <option value="enseignant">Enseignant(e)</option>
                    <option value="etudiant">Étudiant(e)</option>
                    <!--<option value="visiteur">Visiteur</option>-->
                </select>
            </div>

            <div class="field" id="token-field" style="display: none;">
                <label>🔐 Code d'accès profil enseignant(e)(demander à votre administrateur)</label>
                <input type="text" id="token-enseignant" placeholder="Entrez votre token d'accès">
            </div>

            <div class="field" style="background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.25); border-radius: 10px; padding: 14px 16px;">
                <p style="margin: 0; font-size: 13px; color: #a5b4fc; line-height: 1.6;">
                    📧 <strong>Pas de mot de passe !</strong><br>
                    Un token de connexion vous sera envoyé par email après inscription.
                </p>
            </div>

            <button type="submit" class="btn-submit" id="btnReg">S'inscrire</button>
        </form>

        <a href="../login.html" class="link-login">← J'ai déjà un compte</a>
    </div>

    <script>
        function toggleTokenField(val) {
            const field = document.getElementById('token-field');
            field.style.display = val === 'enseignant' ? 'block' : 'none';
            document.getElementById('token-enseignant').value = '';
        }

        function toast(msg, color = '#6ee7b7') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.color = color;
            el.style.border = '1px solid ' + color + '55';
            el.style.background = color + '22';
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1000);
        }

        function register(e) {
            e.preventDefault();

            // 1. Récupération des données du formulaire
            const prenom = document.getElementById('prenom').value.trim();
            const nom = document.getElementById('nom').value.trim();
            const email = document.getElementById('email').value.trim();
            const ecole = document.getElementById('ecole').value.trim();
            const profil = document.getElementById('profil').value;

            if (!prenom || !nom || !email || !ecole || !profil) {
                toast("Veuillez remplir tous les champs", "#ef4444");
                return;
            }

            // Récupération du token (sera vérifié par le serveur)
            const token = document.getElementById('token-enseignant').value.trim();


            // 2. Création de l'objet utilisateur
            const newUser = { prenom, nom, email, ecole, profil };

            // 3. Sauvegarde dans le localStorage
            //let users = JSON.parse(localStorage.getItem('hiParisUsers')) || [];

            // Vérifier si l'email existe déjà
            //const userExists = users.some(u => u.email === email);
            //if (userExists) {
            //     toast("Cette adresse mail est déjà utilisée.", "#ef4444");
            //   return;
            // }

            //  users.push(newUser);
            // localStorage.setItem('hiParisUsers', JSON.stringify(users));

            // 4. Animation du bouton et redirection
            //  const btn = document.getElementById('btnReg');
            //  btn.textContent = 'Création en cours...';
            // btn.style.opacity = '0.7';

            // setTimeout(() => {
            //      btn.textContent = 'Compte créé ! 🎉';
            //      btn.style.background = 'linear-gradient(135deg,#059669,#10b981)';
            //      toast("Inscription réussie, redirection...", "#10b981");

            //      setTimeout(() => {
            //          window.location.href = '../login.html';
            //      }, 1500);
            //  }, 1000);
            // }

            // 3. Sauvegarde dans Supabase via l'API
            const btn = document.getElementById('btnReg');
            btn.textContent = 'Création en cours...';
            btn.style.opacity = '0.7';

            // Mapper le profil frontend vers le rôle base de données
            const roleMap = { 'etudiant': 'STUDENT', 'enseignant': 'TEACHER' };
            const role = roleMap[profil] || 'STUDENT';

            fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, nom, prenom, ecole, role, token })
            })

                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        // Email déjà utilisé ou autre erreur base de données
                        btn.textContent = "S'inscrire";
                        btn.style.opacity = '1';
                        toast("Cette adresse mail est déjà utilisée.", "#ef4444");
                        return;
                    }

                    // 4. Succès : token envoyé par mail, redirection vers login
                    btn.textContent = '📧 Token envoyé !';
                    btn.style.background = 'linear-gradient(135deg,#059669,#10b981)';
                    toast("Compte créé ! Vérifiez votre email 📬", "#10b981");

                    setTimeout(() => {
                        window.location.href = '../login.html';
                    }, 2500);


                })
                .catch(() => {
                    btn.textContent = "S'inscrire";
                    btn.style.opacity = '1';
                    toast("❌ Serveur inaccessible. Réessayez.", "#ef4444");
                });
        }
    </script>

</body>

</html>
