<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Exercise - Neural Playground</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="../styles/custom_exo.css">
</head>

<body>

  <!-- ===============================
       WIDGET GOOGLE TRANSLATE (FR/EN)
  ================================ -->
  <div id="google_translate_element" style="display: none !important;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'fr', 
        includedLanguages: 'en,fr',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <style>
    .goog-te-gadget-simple { background-color: transparent !important; border: none !important; font-family: 'Inter', sans-serif !important; font-size: 14px !important; font-weight: 600 !important; }
    .goog-te-gadget-icon { display: none; }
    body { top: 0px !important; }
    .skiptranslate iframe { display: none !important; }
  </style>

  <!-- ── HEADER UNIVERSEL ── -->
  <header class="universal-header">
    <a class="header-brand" href="login.html">
      <img src="Page-demo/Image/logo_f.png" style="height: 38px;" alt="Logo">
      <span class="brand-name">Neural Playground</span>
    </a>
    <div class="header-right">
      <a class="btn-header" href="#"
        onclick="event.preventDefault(); window.location.href = localStorage.getItem('isLoggedIn') === 'true' ? 'Page-demo/login_with_catalog.html' : 'login.html';">
        <span class="material-icons" style="font-size:18px">arrow_back</span> Retour
      </a>
      <a class="btn-header" href="Page-demo/historique.html">Mon historique</a>
      <div id="widget-profil-header" style="margin-left: 20px;"></div>
    </div>
  </header>

  <!-- ZONE EXERCICE (Refactorisée avec Iframe) -->
  <div id="exercise-container">
    <iframe id="preview-iframe" src="preview_index.html"></iframe>
  </div>

  <script>
    (function () {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const user = JSON.parse(localStorage.getItem('currentUser'));
      const container = document.getElementById('widget-profil-header');

      const iframe = document.getElementById('preview-iframe');
      const hash = localStorage.getItem('custom_exo_hash') || '';
      const css = localStorage.getItem('custom_exo_css') || '';

      if (iframe) {
        iframe.src = 'preview_index.html' + hash;
        iframe.onload = () => {
          iframe.contentWindow.postMessage({ type: 'update-css', css: css }, '*');
        };
      }

      if (container) {
        container.style.cssText = 'position: relative; font-family: "Inter", sans-serif; perspective: 1000px; display: flex; align-items: center;';

        if (!isLoggedIn || !user) {
          const visitorBtn = document.createElement('a');
          visitorBtn.href = 'login.html';
          visitorBtn.style.cssText = 'display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05); padding:6px 20px 6px 6px; border-radius:50px; color:#fff; text-decoration:none; backdrop-filter:blur(20px); border:1px solid rgba(139,92,246,0.3); font-size:14px; box-shadow: 0 0 15px rgba(139,92,246,0.2); transition: 0.3s;';
          visitorBtn.innerHTML = '<div style="background:linear-gradient(135deg, #8b5cf6, #3b82f6); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 10px rgba(139,92,246,0.5);">👤</div> <span style="font-weight:600; letter-spacing:0.5px;">Vous n\'êtes pas connecté!</span>';
          container.appendChild(visitorBtn);
        } else {
          const initials = ((user.prenom || "")[0] + (user.nom || "")[0]).toUpperCase();
          container.innerHTML = `<div style="width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg, #10b981, #3b82f6); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; cursor:pointer;">${initials}</div>`;
        }
      }
    })();
  </script>

  <!-- Google analytics -->
  
  <!-- Ce script permet de gérer l'inactivité de l'utilisateur -->
  <script src="inactivite.js"></script>
</body>

</html>
