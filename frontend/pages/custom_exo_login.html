<!doctype html>
<html>

<head lang="fr">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024">
  <title>Neural Playground - Finalization</title>

  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500|Material+Icons" rel="stylesheet"
    type="text/css">
  <!-- bundle.css et lib.js sont pour preview_index.html (iframe), pas pour cette page -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../styles/custom_exo_login.css">

  <script>
    const c = localStorage.getItem('custom_exo_css');
    if (c) {
      const s = document.createElement('style');
      s.textContent = c;
      document.head.appendChild(s);
    }
    const h = localStorage.getItem('custom_exo_hash');
    if (h && !window.location.hash) {
      window.location.hash = h;
    }
  </script>


</head>

<body>


  <div id="bg-container"></div>

  <header>
    <a class="header-brand" href="index.html">
      <div class="brand-icon">
        <img src="Page-demo/Image/logo_f.png"
          style="width: 38px; height: 38px; border-radius: 8px; object-fit: contain;" alt="Logo">
      </div>
      <span class="brand-name">Neural Playground</span>
    </a>

    <div class="header-right">
      <a class="btn-back" href="create.html">
        <span class="material-icons" style="font-size: 18px;">settings</span>
        Edit Architecture
      </a>
      <div id="widget-profil-header" style="margin-left: 20px;"></div>
    </div>
  </header>

  <!-- Panneau flottant de Soumission -->
  <aside class="submission-overlay">
    <span class="tag">Final Step</span>
    <h2 class="overlay-h">Project Submission</h2>

    <div class="field-group">
      <label class="label">Exercise Description <span id="desc-counter"
          style="color: #f87171; float: right;">0/50</span></label>
      <textarea id="exo-desc" class="input-ui" rows="5" placeholder="Explain the educational objective..."
        oninput="updateCounters()"></textarea>
    </div>

    <div class="field-group">
      <label class="label">Quiz Question <span id="quiz-counter"
          style="color: #f87171; float: right;">0/50</span></label>
      <textarea id="quiz-question" class="input-ui" rows="3" placeholder="Insert the quiz question..."
        oninput="updateCounters()"></textarea>
    </div>

    <div class="field-group">
      <label class="label">Options de réponse (Cochez la bonne)</label>
      <div id="quiz-answers-container" style="display: flex; flex-direction: column; gap: 10px;">
        <!-- Injecté par JS -->
      </div>
      <button onclick="addQuizAnswer()" class="btn-add-answer">
        <span class="material-icons">add_circle_outline</span> Add an option
      </button>
    </div>

    <button onclick="handleAddToList()" class="btn-submit">
      <span class="material-icons">rocket_launch</span>
      Publish to Catalog
    </button>
    <button onclick="saveToPersonalProfile()"
      style="background:none; border:none; color:var(--text-dim); font-size:12px; margin-top:15px; cursor:pointer; text-decoration:underline;">Sauvegarder
      en brouillon</button>
  </aside>

  <!-- ZONE EXERCICE (Refactorisée avec Iframe) -->
  <div id="exercise-container">
    <iframe id="preview-iframe" src="preview_index.html"></iframe>
  </div>

  <script>
    const userGlobal = JSON.parse(localStorage.getItem('currentUser') || '{}');

    // Initialisation Iframe et Sync
    (function () {
      const iframe = document.getElementById('preview-iframe');
      const hash = localStorage.getItem('custom_exo_hash') || '';
      const css = localStorage.getItem('custom_exo_css') || '';

      if (iframe) {
        iframe.src = 'preview_index.html' + hash;
        iframe.onload = () => {
          iframe.contentWindow.postMessage({ type: 'update-css', css: css }, '*');
        };
      }

      // Initialisation du Widget de Profil Premium
      initProfileWidget();

      const bg = document.getElementById('bg-container');
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div'); p.className = 'neuron-particle';
        const size = Math.random() * 5 + 2; p.style.width = size + 'px'; p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + 'vw'; p.style.top = Math.random() * 100 + 'vh';
        bg.appendChild(p);
      }

      // Init Quiz
      addQuizAnswer("Option 1...", true);
      addQuizAnswer("Option 2...", false);
      updateCounters();
    })();

    function updateCounters() {
      const desc = document.getElementById('exo-desc').value.trim();
      const quiz = document.getElementById('quiz-question').value.trim();

      const descCount = document.getElementById('desc-counter');
      const quizCount = document.getElementById('quiz-counter');

      descCount.innerText = `${desc.length}/50`;
      descCount.style.color = desc.length >= 50 ? '#10b981' : '#f87171';

      quizCount.innerText = `${quiz.length}/50`;
      quizCount.style.color = quiz.length >= 50 ? '#10b981' : '#f87171';
    }

    // --- LOGIQUE QUIZ ---
    function addQuizAnswer(text = "", isCorrect = false) {
      const container = document.getElementById('quiz-answers-container');
      const row = document.createElement('div');
      row.className = 'quiz-answer-row';
      row.innerHTML = `
        <input type="radio" name="correct-answer" class="answer-correct-radio" ${isCorrect ? 'checked' : ''}>
        <input type="text" class="answer-text" placeholder="Answer..." value="${text}">
        <div class="btn-remove-answer" onclick="this.parentElement.remove()">
          <span class="material-icons" style="font-size: 18px;">delete</span>
        </div>
      `;
      container.appendChild(row);
    }

    // --- LOGIQUE MÉTIER RÉELLE ---
    function getExoData() {
      const now = new Date();
      const j = now.getDate().toString().padStart(2, '0');
      const m = (now.getMonth() + 1).toString().padStart(2, '0');
      const dateStr = `${j}-${m}`;
      const h = now.getHours();
      const min = now.getMinutes().toString().padStart(2, '0');
      const timeStr = `${h}h${min}`;

      const answers = [];
      document.querySelectorAll('.quiz-answer-row').forEach(row => {
        answers.push({
          text: row.querySelector('.answer-text').value,
          isCorrect: row.querySelector('.answer-correct-radio').checked
        });
      });

      // On combine le CSS et le Hash dans le JSON de config
      const config_json = {
        css: localStorage.getItem('custom_exo_css') || '',
        hash: localStorage.getItem('custom_exo_hash') || '',
        quiz: {
          question: document.getElementById('quiz-question').value,
          answers: answers
        }
      };

      return {
        title: `Exercice_${userGlobal.prenom || 'Guest'}_${dateStr}_${timeStr}`,
        description: document.getElementById('exo-desc').value,
        config_json: config_json,
        creator_id: userGlobal.id, // Utilise l'ID UUID de Supabase
        visibility: 'PUBLIC'
      };
    }



    async function saveToPersonalProfile() {
      const data = getExoData();
      try {
        const response = await fetch('/api/exercises', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...data,
            is_official: false,
            visibility: 'PRIVATE' // Brouillon privé
          })
        });
        if (response.ok) {
          const saved = await response.json();
          alert(`✨ Draft saved to the database!\nID : ${saved.id}\nYou can complete and publish it from your history.`);
        } else {
          const err = await response.json();
          alert("Error saving: " + (err.error || 'Unknown error'));
        }
      } catch (error) {
        console.error("Network error:", error);
        alert("Network error. Check your connection.");
      }
    }

    async function handleAddToList() {
      const desc = document.getElementById('exo-desc').value.trim();
      const quiz = document.getElementById('quiz-question').value.trim();

      if (desc.length < 50 || quiz.length < 50) {
        return alert("Error: The description and quiz question must be at least 50 characters each.");
      }

      const profil = (userGlobal.role || userGlobal.profil || '').toLowerCase();
      const data = getExoData();

      if (profil === 'enseignant' || profil === 'teacher') {
        // Publication directe pour les enseignants
        try {
          const response = await fetch('/api/exercises', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...data,
              is_official: true,
              visibility: 'PUBLIC'
            })
          });

          if (response.ok) {
            alert("Exercise added directly to the catalog (teacher mode)! 🚀");
            window.location.href = 'Page-demo/exercises.html';
          } else {
            const err = await response.json();
            alert("Error publishing: " + (err.error || 'Unknown error'));
          }
        } catch (error) {
          console.error("Network error:", error);
          alert("Network error while publishing.");
        }
      } else {
        // Les étudiants doivent choisir un enseignant avant de soumettre
        openTeacherModal();
      }
    }


    async function openTeacherModal() {
      const select = document.getElementById('teacher-select');
      select.innerHTML = '<option>Loading teachers...</option>';
      document.getElementById('teacher-modal').style.display = 'flex';

      try {
        const res = await fetch('/api/teachers');
        const teachers = await res.json();

        select.innerHTML = '';
        if (!teachers || !teachers.length) {
          select.innerHTML = '<option disabled>No teachers available</option>';
        } else {
          teachers.forEach(t => {
            select.innerHTML += `<option value="${t.id}">${t.prenom} ${t.nom} (${t.email})</option>`;
          });
        }
      } catch (err) {
        select.innerHTML = '<option disabled>Loading error</option>';
      }
    }


    function closeTeacherModal() {
      document.getElementById('teacher-modal').style.display = 'none';
    }

    async function submitToTeacher() {
      const teacherId = document.getElementById('teacher-select').value;
      if (!teacherId || teacherId.includes("Chargement") || teacherId.includes("Aucun")) {
        return alert("Please choose a valid teacher.");
      }

      const data = getExoData();

      try {
        const response = await fetch('/api/exercises', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...data,
            is_official: false,
            visibility: 'PRIVATE', // Visible uniquement par l'étudiant et le prof (via la soumission)
            teacher_id: teacherId
          })
        });

        if (response.ok) {
          alert("Exercise sent for validation!");
          closeTeacherModal();
          window.location.href = 'Page-demo/exercises.html';
        } else {
          const err = await response.json();
          alert("Error during submission: " + (err.error || 'Unknown error'));
        }
      } catch (error) {
        console.error("Network error:", error);
        alert("Network error during submission.");
      }
    }

    function initProfileWidget() {
      const container = document.getElementById('widget-profil-header');
      if (!container) return;
      const userStr = localStorage.getItem('currentUser');
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      let user = null;
      try { user = userStr ? JSON.parse(userStr) : null; } catch (e) { console.error(e); }

      if (!isLoggedIn || !user) {
        container.innerHTML = `
                <a href="login.html" class="btn-back" style="background:rgba(139,92,246,0.1); border-color:rgba(139,92,246,0.3); color:#fff;">
                    <span class="material-icons" style="font-size:16px">login</span> 
                    Login
                </a>`;
        return;
      }

      const p_ = user.prenom || ""; const n_ = user.nom || ""; const initials = (p_[0] || "") + (n_[0] || "") || "U";
      const role = (user.role || user.profil || 'étudiant').toUpperCase();

      container.innerHTML = `
            <div class="avatar-box" style="position:relative;">${initials.toUpperCase()}</div>
            <div class="profile-menu">
                <div style="padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05)">
                    <div style="font-weight: 800; color: #fff; font-size:15px; letter-spacing:-0.3px;">${p_} ${n_}</div>
                    <div style="font-size: 11px; color: #94a3b8; margin-top:2px;">${user.email || ''}</div>
                    <div style="display:inline-block; margin-top:10px; padding:3px 10px; background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.2); border-radius:20px; font-size:9px; font-weight:700; color:#10b981;">🟢 ${role}</div>
                </div>
                <div style="padding: 5px;">
                    <a href="Page-demo/historique.html" class="menu-link">
                        <span class="material-icons" style="font-size:18px; color:#3b82f6;">history</span> 
                        My History
                    </a>
                    <a href="statsetudiant.html" class="menu-link">
                        <span class="material-icons" style="font-size:18px; color:#3b82f6;">leaderboard</span> 
                        My Statistics
                    </a>
                    <div class="menu-link" id="logout-btn" style="color: #f87171; cursor:pointer;">
                        <span class="material-icons" style="font-size:18px;">logout</span> 
                        Logout
                    </div>
                </div>
            </div>`;

      const avatar = container.querySelector('.avatar-box');

      // --- NOUVEAU : Notifications ---
      (async () => {
        try {
          let count = 0;
          if (role.includes('TEACH') || role.includes('ENS')) {
            const res = await fetch(`/api/submissions/teacher/${user.id}/count`, { headers: { 'x-user-email': user.email } });
            const data = await res.json();
            count = data.count || 0;
          } else {
            const res = await fetch(`/api/submissions/student/${user.id}`);
            const subs = await res.json();
            count = subs.filter(s => s.status !== 'PENDING').length;
          }
          if (count > 0 && avatar) {
            const badge = document.createElement('span');
            badge.style.cssText = 'position:absolute; top:-5px; right:-5px; background:#ef4444; color:white; border-radius:50%; width:18px; height:18px; font-size:10px; display:flex; align-items:center; justify-content:center; border:2px solid #0f172a; font-weight:800; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);';
            badge.innerText = count;
            avatar.appendChild(badge);
          }
        } catch (e) { console.error("Badge error:", e); }
      })();

      const menu = container.querySelector('.profile-menu');
      if (avatar && menu) {
        avatar.onclick = (e) => {
          e.stopPropagation();
          menu.classList.toggle('show');
        };
        avatar.onmouseover = () => avatar.style.transform = 'scale(1.1)';
        avatar.onmouseout = () => avatar.style.transform = 'scale(1)';
      }
      const logoutBtn = container.querySelector('#logout-btn');
      if (logoutBtn) {
        logoutBtn.onclick = () => {
          localStorage.removeItem('isLoggedIn');
          localStorage.removeItem('currentUser'); // ✅ Nettoyage complet de la session
          window.location.href = 'login.html';
        };
      }
    }

  </script>

  <!-- MODAL SÉLECTION ENSEIGNANT -->
  <div id="teacher-modal"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100000; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
    <div
      style="background:white; padding:30px; border-radius:15px; width:90%; max-width:400px; color:#333; font-family:'Inter', sans-serif;">
      <h3 style="margin-top:0;">Submit to a teacher</h3>
      <p style="font-size:14px; color:#666;">Choose the teacher who will validate your exercise:</p>
      <select id="teacher-select"
        style="width:100%; padding:10px; margin:15px 0; border:1px solid #ccc; border-radius:5px;"></select>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button onclick="closeTeacherModal()"
          style="padding:8px 15px; border:none; background:#eee; border-radius:5px; cursor:pointer;">Cancel</button>
        <button onclick="submitToTeacher()"
          style="padding:8px 15px; border:none; background:#0877bd; color:white; border-radius:5px; cursor:pointer;">Send for validation</button>
      </div>
    </div>
  </div>

  <!-- bundle.js est pour preview_index.html (iframe TF Playground), pas pour cette page -->
  

  <!-- Ce script allows to manage l'inactivité de l'utilisateur : il redirige vers la page d'accueil après 10 minutes d'inactivité -->
  <script src="inactivite.js"></script>
</body>

</html>
