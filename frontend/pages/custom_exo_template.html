<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="page-title">Exercice Personnalisé</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles/exo.css">
  <link rel="stylesheet" href="../styles/custom_exo_template.css">

</head>

<body>

  <!-- ===============================
       WIDGET GOOGLE TRANSLATE (FR/EN)
  ================================ -->
  <div id="google_translate_element" style="display: none !important;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'fr', 
        includedLanguages: 'en,fr',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <style>
    .goog-te-gadget-simple { background-color: transparent !important; border: none !important; font-family: 'Inter', sans-serif !important; font-size: 14px !important; font-weight: 600 !important; }
    .goog-te-gadget-icon { display: none; }
    body { top: 0px !important; }
    .skiptranslate iframe { display: none !important; }
  </style>

  <div id="background-container"></div>
  <header class="universal-header">
    <a class="header-brand" href="index.html">
      <div class="brand-icon"><img src="Page-demo/Image/logo_f.png" style="width:100%;height:100%;object-fit:contain;">
      </div>
      <span class="brand-name">Neural Playground</span>
    </a>
    <div class="header-right">
      <a class="btn-header" href="Page-demo/exercises.html">Catalogue</a>
      <a class="btn-header" href="Page-demo/historique.html">Historique</a>
      <div id="widget-profil-header" style="margin-left:20px;"></div>
    </div>
  </header>

  <section class="exo-header">
    <div class="exo-toprow">
      <div class="badge">PRO</div>
      <h1 class="exo-title" id="display-title">Chargement...</h1>
    </div>
    <p class="exo-instructions" id="display-desc">Récupération des instructions...</p>
  </section>

  <main class="exo-main" style="display:flex; gap:20px; padding:0 20px;">
    <iframe id="exo-frame" class="exo-frame" src=""
      style="flex:1; border-radius:24px; border:1px solid rgba(255,255,255,0.1); min-height:600px;"></iframe>
    <aside id="validation-sidebar"
      style="display:none; width:350px; background:#0f172a; border:1px solid rgba(255,255,255,0.1); border-radius:24px; padding:25px; flex-direction:column; overflow-y:auto;">
      <h3 style="color:#fff; font-size:18px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:15px;">🔍
        Validation Enseignant</h3>
      <div id="validation-quiz-content" style="flex:1;"></div>
      <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
        <button id="btn-approve-sidebar"
          style="background:linear-gradient(135deg, #10b981, #059669); border:none; padding:12px; border-radius:12px; color:white; font-weight:600; cursor:pointer;">✅
          Approuver</button>
        <button id="btn-reject-sidebar"
          style="background:#ef4444; border:none; padding:12px; border-radius:12px; color:white; font-weight:600; cursor:pointer;">❌
          Rejeter</button>
        <textarea id="rejection-comment" placeholder="Motif du rejet..."
          style="width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px; color:#fff; min-height:80px;"></textarea>
      </div>
    </aside>
  </main>

  <div id="quiz-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="quiz-modal-question">Question du Quiz</h3>
      <div id="quiz-modal-answers" class="quiz-options"></div>
      <div class="modal-actions">
        <button onclick="document.getElementById('quiz-modal').classList.remove('open')"
          class="btn-modal btn-modal-secondary">Annuler</button>
        <button id="btn-confirm-quiz" class="btn-modal btn-modal-primary">Confirmer</button>
      </div>
    </div>
  </div>

  <div class="exo-actions-footer">
    <button id="btn-sauvegarder" class="btn-action-premium" style="background-color: #004676;">
      <span class="icon">💾</span> SAUVEGARDER
    </button>
    <button id="btn-realise" class="btn-action-premium">✅ Réussi !!</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const exoId = urlParams.get('id');
    const modePending = urlParams.get('mode') === 'pending';
    const submissionId = urlParams.get('submission_id');
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    let exo = null, isAlreadyCompleted = false, selectedAnswerIndex = -1;

    async function initProfileWidget() {
      const container = document.getElementById('widget-profil-header');
      if (!container) return;

      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const currentUserStr = localStorage.getItem('currentUser');
      let currentUser = null;
      try {
        currentUser = currentUserStr ? JSON.parse(currentUserStr) : null;
      } catch (e) {
        console.error(e);
      }

      if (!isLoggedIn || !currentUser || !currentUser.email) {
        container.innerHTML = `<a href="Page-demo/login_with_catalog.html" class="btn-header">Connexion</a>`;
        return;
      }

      container.style.cssText = 'position: relative; font-family: "Inter", sans-serif; perspective: 1000px; display: flex; align-items: center;';

      const initials = (((currentUser.prenom || "")[0] || "") + ((currentUser.nom || "")[0] || "")).toUpperCase() || "U";
      const role = (currentUser.role || currentUser.profil || 'étudiant').toUpperCase();
      let badgeHtml = '';

      try {
        if (role.includes('TEACH') || role.includes('ENS')) {
          const res = await fetch(`/api/submissions/teacher/${currentUser.id}/count`, { headers: { 'x-user-email': currentUser.email } });
          const { count } = await res.json();
          if (count > 0) badgeHtml = `<span class="badge-notif">${count}</span>`;
        } else {
          const res = await fetch(`/api/submissions/student/${currentUser.id}`);
          const subs = await res.json();
          const feedbackCount = subs.filter(s => s.status !== 'PENDING').length;
          if (feedbackCount > 0) badgeHtml = `<span class="badge-notif">${feedbackCount}</span>`;
        }
      } catch (e) { console.error("Erreur badge:", e); }

      const avatar = document.createElement('div');
      avatar.id = 'avatar-btn';
      avatar.style.cssText = 'position: relative; width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, rgb(16, 185, 129), rgb(59, 130, 246)); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: white; cursor: pointer; border: 2px solid rgba(255, 255, 255, 0.2); box-shadow: rgba(16, 185, 129, 0.4) 0px 0px 20px, rgba(255, 255, 255, 0.3) 0px 0px 10px inset; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); transform: scale(1) rotate(0deg);';
      avatar.innerHTML = `${initials}${badgeHtml}`;

      avatar.onmouseover = () => avatar.style.transform = 'scale(1.1) rotate(5deg)';
      avatar.onmouseout = () => avatar.style.transform = 'scale(1) rotate(0deg)';

      const menu = document.createElement('div');
      menu.id = 'profile-menu';
      menu.style.cssText = 'display: none; position: absolute; top: 60px; right: 0px; width: 260px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(25px); border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 20px; box-shadow: rgba(0, 0, 0, 0.5) 0px 25px 50px, rgba(255, 255, 255, 0.05) 0px 0px 0px 1px inset; overflow: hidden; transform-origin: right top; transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0; transform: scale(0.9) translateY(-10px); pointer-events: none; z-index: 1001;';

      const typeProfil = role.includes('TEACH') || role.includes('ENS') ? 'TEACHER' : role;

      menu.innerHTML = `
        <div style="padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); background: linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);">
          <div style="font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.5px;">${currentUser.prenom} ${currentUser.nom}</div>
          <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">${currentUser.email || ''}</div>
          <div style="display: inline-block; margin-top: 12px; padding: 4px 10px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 30px; font-size: 10px; font-weight: 700; color: #10b981; text-transform: uppercase; letter-spacing: 1px;">🟢 Profil ${typeProfil}</div>
        </div>
        <div style="padding: 8px;">
          <a href="Page-demo/historique.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: #e2e8f0; text-decoration: none; font-size: 13px; font-weight: 600; transition: all 0.2s; cursor: pointer;" onmouseover="this.style.background='rgba(59, 130, 246, 0.1)'; this.style.color='#60a5fa'; this.style.transform='translateX(5px)';" onmouseout="this.style.background='transparent'; this.style.color='#e2e8f0'; this.style.transform='translateX(0)';">
            <span style="font-size: 16px;">📊</span> Mon Historique
          </a>
          <a href="statsetudiant.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: #e2e8f0; text-decoration: none; font-size: 13px; font-weight: 600; transition: all 0.2s; cursor: pointer; margin-top: 2px;" onmouseover="this.style.background='rgba(59, 130, 246, 0.1)'; this.style.color='#60a5fa'; this.style.transform='translateX(5px)';" onmouseout="this.style.background='transparent'; this.style.color='#e2e8f0'; this.style.transform='translateX(0)';">
            <span style="font-size: 16px;">📈</span> Mes Statistiques
          </a>
          <div id="logout-btn" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: #f87171; font-size: 13px; font-weight: 600; transition: all 0.2s; cursor: pointer; margin-top: 2px;" onmouseover="this.style.background='rgba(239, 68, 68, 0.1)'; this.style.transform='translateX(5px)';" onmouseout="this.style.background='transparent'; this.style.transform='translateX(0)';">
            <span style="font-size: 16px;">🚪</span> Déconnexion
          </div>
        </div>
      `;

      let isOpen = false;
      avatar.onclick = (e) => {
        e.stopPropagation();
        isOpen = !isOpen;
        if (isOpen) {
          menu.style.display = 'block';
          setTimeout(() => {
            menu.style.opacity = '1';
            menu.style.transform = 'scale(1) translateY(0)';
            menu.style.pointerEvents = 'auto';
          }, 10);
        } else {
          menu.style.opacity = '0';
          menu.style.transform = 'scale(0.9) translateY(-10px)';
          menu.style.pointerEvents = 'none';
          setTimeout(() => menu.style.display = 'none', 300);
        }
      };

      document.addEventListener('click', (e) => {
        if (!container.contains(e.target) && isOpen) {
          isOpen = false;
          menu.style.opacity = '0';
          menu.style.transform = 'scale(0.9) translateY(-10px)';
          menu.style.pointerEvents = 'none';
          setTimeout(() => menu.style.display = 'none', 300);
        }
      });

      menu.querySelector('#logout-btn').onclick = () => {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('currentUser');
        window.location.href = 'index.html';
      };

      container.innerHTML = '';
      container.appendChild(avatar);
      container.appendChild(menu);
    }

    async function initExercise() {
      if (!exoId) return;
      try {
        const res = await fetch(`/api/exercises/${exoId}`);
        if (res.ok) {
          const data = await res.json();
          let config = data.config_json;
          if (typeof config === 'string') try { config = JSON.parse(config); } catch (e) { }
          exo = { ...data, ...config };
          if (user.email) {
            const progRes = await fetch(`/api/progress?email=${encodeURIComponent(user.email)}&exercise_id=${exo.id}`);
            if (progRes.ok) {
              const progData = await progRes.json();
              isAlreadyCompleted = progData.some(p => p.status === 'COMPLETED');
            }
          }
        }
        renderExercise();
      } catch (e) { console.error(e); renderExercise(); }
    }

    function renderExercise() {
      const titleEl = document.getElementById('display-title'), descEl = document.getElementById('display-desc');
      if (!exo) { titleEl.innerText = "Exercice introuvable"; return; }
      titleEl.innerText = exo.title;
      descEl.innerHTML = `<b>Objectif :</b> ${exo.description || 'Non défini'}`;
      const iframe = document.getElementById('exo-frame');
      iframe.src = 'preview_index.html' + (exo.hash || '');
      iframe.onload = () => iframe.contentWindow.postMessage({ type: 'update-css', css: exo.css }, '*');
      if (isAlreadyCompleted) {
        const btn = document.getElementById('btn-realise');
        btn.innerHTML = '✅ Exercice Réussi !!'; btn.classList.add('completed');
      }
      if (modePending) {
        document.getElementById('validation-sidebar').style.display = 'flex';
        document.querySelector('.exo-actions-footer').style.display = 'none';
        renderTeacherView();
      }
    }

    function renderTeacherView() {
      const container = document.getElementById('validation-quiz-content');
      if (exo.quiz?.question) {
        let html = `<p style="color:#fff; font-weight:600; margin-bottom:15px;">${exo.quiz.question}</p>`;
        exo.quiz.answers.forEach(ans => {
          html += `<div style="padding:10px; margin-bottom:8px; border:1px solid ${ans.isCorrect ? '#10b981' : '#ef4444'}; border-radius:8px; display:flex; justify-content:space-between; background:rgba(0,0,0,0.2);">
            <span>${ans.text}</span><span>${ans.isCorrect ? '✅' : '❌'}</span>
          </div>`;
        });
        container.innerHTML = html;
      }
      document.getElementById('btn-approve-sidebar').onclick = async () => {
        if (!confirm("Approuver cet exercice ?")) return;
        const res = await fetch(`/api/submissions/${submissionId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'x-user-email': user.email },
          body: JSON.stringify({ status: 'APPROVED' })
        });
        if (res.ok) { alert("Approuvé !"); window.location.href = 'Page-demo/exercises.html'; }
      };
      document.getElementById('btn-reject-sidebar').onclick = async () => {
        const feedback = document.getElementById('rejection-comment').value.trim();
        if (!feedback) return alert("Motif requis.");
        const res = await fetch(`/api/submissions/${submissionId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'x-user-email': user.email },
          body: JSON.stringify({ status: 'REJECTED', feedback })
        });
        if (res.ok) { alert("Rejeté !"); window.location.href = 'Page-demo/exercises.html'; }
      };
    }

    document.getElementById('btn-realise').onclick = () => {
      if (modePending) return;
      if (exo.quiz?.question) {
        const modal = document.getElementById('quiz-modal');
        document.getElementById('quiz-modal-question').innerText = exo.quiz.question;
        const aContainer = document.getElementById('quiz-modal-answers');
        aContainer.innerHTML = '';
        exo.quiz.answers.forEach((ans, idx) => {
          const div = document.createElement('div'); div.className = 'quiz-opt';
          div.innerHTML = `<div class="radio-circle"></div><span>${ans.text}</span>`;
          div.onclick = () => {
            document.querySelectorAll('.quiz-opt').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected'); selectedAnswerIndex = idx;
          };
          aContainer.appendChild(div);
        });
        modal.classList.add('open');
      } else markCompleted();
    };

    document.getElementById('btn-confirm-quiz').onclick = () => {
      if (selectedAnswerIndex === -1) return alert("Sélectionnez une réponse.");
      if (exo.quiz.answers[selectedAnswerIndex].isCorrect) {
        alert("Bravo !"); document.getElementById('quiz-modal').classList.remove('open'); markCompleted();
      } else alert("Mauvaise réponse.");
    };

    let startTime = Date.now(); // Lancement du chrono
    function getElapsedTime() {
      return Math.floor((Date.now() - startTime) / 1000); // Retourne les secondes
    }

    async function markCompleted() {
      if (!user || !user.email) return alert("Veuillez vous connecter pour enregistrer votre réussite.");
      const duration = getElapsedTime();
      try {
        const res = await fetch('/api/progress', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: user.email.toLowerCase(),
            exercise_id: exo.id,
            status: 'COMPLETED',
            time_spent: duration
          })
        });
        const result = await res.json();
        if (res.ok) {
          document.getElementById('btn-realise').innerHTML = '✨ Validé !';
          setTimeout(() => window.location.href = 'Page-demo/historique.html#completed', 1000);
        } else {
          alert("Erreur lors de la validation : " + (result.error || "Inconnu"));
        }
      } catch (err) {
        alert("Erreur réseau lors de la validation.");
      }
    }

    document.getElementById('btn-sauvegarder').onclick = async (e) => {
      if (!user || !user.email) return alert("Veuillez vous connecter pour sauvegarder cet exercice.");
      const btn = e.target;
      try {
        const res = await fetch('/api/progress', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: user.email.toLowerCase(),
            exercise_id: exo.id,
            is_saved: true
          })
        });
        const result = await res.json();
        if (res.ok) {
          btn.innerHTML = '✅ Enregistré !';
          // On ne redirige plus pour laisser l'utilisateur continuer
        } else {
          alert("Erreur lors de la sauvegarde : " + (result.error || "Inconnu"));
        }
      } catch (err) {
        alert("Erreur réseau lors de la sauvegarde.");
      }
    };

    window.addEventListener('message', (e) => { if (e.data?.type === 'PLAYGROUND_VALIDATE_CLICK') document.getElementById('btn-realise').click(); });
    document.addEventListener('DOMContentLoaded', () => { initProfileWidget(); initExercise(); });
  </script>
  <script src="inactivite.js"></script>
</body>

</html>
