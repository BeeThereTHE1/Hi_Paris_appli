<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bientôt Disponible - Hi! Paris Playground</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Nunito:wght@600;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../styles/en_construction.css">

</head>

<body>

  <!-- ===============================
       WIDGET GOOGLE TRANSLATE (FR/EN)
  ================================ -->
  <div id="google_translate_element" style="display: none !important;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'fr', 
        includedLanguages: 'en,fr',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <style>
    .goog-te-gadget-simple { background-color: transparent !important; border: none !important; font-family: 'Inter', sans-serif !important; font-size: 14px !important; font-weight: 600 !important; }
    .goog-te-gadget-icon { display: none; }
    body { top: 0px !important; }
    .skiptranslate iframe { display: none !important; }
  </style>


  <!-- Aura lumineuse en arrière-plan -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Carte Centrale -->
  <div class="construction-container">

    <!-- Émojis animés : Cerveau central qui bat et engrenages qui tournent -->
    <div class="anim-icons">
      <span class="gear">⚙️</span>
      <span class="pulse-brain">🚧🔨</span>
      <span class="gear reverse">⚙️</span>
    </div>

    <h1>Oups! elle est en cours de création !</h1>

    <p>
      Cette fonctionnalité est <b>en cours de développement par nos équipes</b> et sera bientôt disponible.
    </p>

    <!-- Fausse barre de chargement d'IA -->
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <!-- Redirection propre vers la page d'accueil -->
    <a href="index.html" class="btn-retour">
      <span>◄</span> Retour à l'accueil
    </a>

  </div>

</body>

</html>
