<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 12</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/exo.css" />
</head>

<body>
  <div id="background-container"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <header class="universal-header">
    <a class="header-brand" href="index.html">
      <div class="brand-icon">
        <img src="Page-demo/Image/logo_f.png" style="width: 100%; height: 100%; border-radius: 10%; object-fit: contain;" alt="Logo">
      </div>
      <span class="brand-name">Neural Playground</span>
    </a>

    <div class="header-right">
      <a class="btn-header" href="Page-demo/exercises.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        Back to exercises page
      </a>
      <a class="btn-header" href="exo11.html" style="background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.5);">⏮️ Previous exercise</a>
      <a class="btn-header" href="exo13.html" style="background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.5);">Next exercise ⏭️</a>
      <a class="btn-header" href="Page-demo/historique.html">My history</a>
      <div id="widget-profil-header" style="margin-left: 20px;"></div>
    </div>
  </header>

  <div class="exo-actions-footer">
    <button id="btn-sauvegarder" class="btn-action-premium" style="background-color: #004676;">
      <span class="icon">💾</span> Save draft
    </button>
    <button id="btn-realise" class="btn-action-premium btn-disabled" disabled>
      <span class="icon">📝</span> Take the quiz
    </button>
  </div>

  <section class="exo-header">
    <div class="exo-toprow">
      <div class="badge">12</div>
      <h1 class="exo-title">Overfitting</h1>
    </div>
    <p class="exo-instructions">
      Observe how an overly complex model fits training data too closely.
    </p>
  </section>

  <main class="exo-main" id="main-content">
    <div id="simulator-phase" style="width: 100%; height: 100%;">
      <iframe class="exo-frame" src="./playground/index.html?exo=12"></iframe>
    </div>
    <div id="quiz-phase" style="display: none; width: 100%; height: 100%; overflow-y: auto; padding: 20px;">
      <div class="quiz-div-1" id="quiz-question-panel"></div>
      <div class="quiz-div-2" id="quiz-feedback-panel"></div>
    </div>
  </main>

  <script src="inactivite.js"></script>
  <script src="../playground-master/src/core/ApiClient.js"></script>
  <script src="../playground-master/src/core/ExoBase.js"></script>
  <script src="../playground-master/src/exos/storage_service.js"></script>
  <script src="../playground-master/src/exos/exo_common_oop.js"></script>
  <script src="../playground-master/src/exos/exo12_page.js"></script>
  <script>
    const btnRealise = document.getElementById('btn-realise');
    if (btnRealise) {
      btnRealise.addEventListener('click', () => {
        document.getElementById('simulator-phase').style.display = 'none';
        document.getElementById('quiz-phase').style.display = 'block';
      });
    }
  </script>
</body>
</html>
