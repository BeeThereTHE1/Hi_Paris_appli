<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercice 12</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles/exo.css" />
  <link rel="stylesheet" href="../styles/exo_quiz.css" />
  <style>
    html body main.quiz-layout-container .simulator-container {
      width: 50% !important;
    }
    html body main.quiz-layout-container .quiz-panel-container {
      width: 50% !important;
    }
  </style>
</head>

<body>


  <div id="background-container"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <header class="universal-header">
    <a class="header-brand" href="index.html">
      <div class="brand-icon">
        <img src="Page-demo/Image/logo_f.png" style="width: 100%; height: 100%; border-radius: 10%; object-fit: contain;" alt="Logo">
      </div>
      <span class="brand-name">Neural Playground</span>
    </a>

    <div class="header-right">
      <a class="btn-header" href="Page-demo/exercises.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        Back to exercises page
      </a>
      <a class="btn-header" href="exo16.html" style="background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.5);">⏮️ Previous exercise</a>
      <a class="btn-header" href="Page-demo/exercises.html" style="background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.5);">Retour aux Exercices ⏭️</a>
      <a class="btn-header" href="Page-demo/historique.html">My history</a>
      <div id="widget-profil-header" style="margin-left: 20px;"></div>
    </div>
  </header>

  <div class="exo-actions-footer">
    <button id="btn-sauvegarder" class="btn-action-premium" style="background-color: #004676;">
      <span class="icon">💾</span> Save draft
    </button>
    <button id="btn-realise" class="btn-action-premium btn-disabled" disabled>
      <span class="icon">✅</span> Exercise Successful !!
    </button>
  </div>

  <section class="exo-header">
    <div class="exo-toprow">
      <div class="badge">12</div>
      <h1 class="exo-title">Overfitting</h1>
    </div>
    <p class="exo-instructions">
      Observe how an overly complex model fits training data too closely.
    </p>
  </section>

  <div id="main-part">
    <main class="quiz-layout-container">
      <div class="simulator-container">
        <iframe class="exo-frame" id="iframe-playground" src="./playground/index.html?exo=12"></iframe>
      </div>
      <div class="quiz-panel-container">
        <div class="quiz-div-1" id="quiz-question-panel">
          <!-- Dynamically populated activity cards -->
        </div>
        <div class="quiz-div-2" id="quiz-feedback-panel">
          <!-- Dynamically populated explanation feedback bubbles -->
        </div>
      </div>
    </main>
  </div>

  <script src="inactivite.js"></script>
  <script src="../playground-master/src/exos/storage_service.js"></script>
  <script src="../playground-master/src/exos/exo12_page.js"></script>
</body>
</html>
