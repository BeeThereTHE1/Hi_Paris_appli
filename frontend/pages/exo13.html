<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 13</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles/exo.css" />
</head>

<body>


  <!-- Conteneur pour l'animation de fond -->
  <div id="background-container"></div>

  <!-- Arrière-plan : Orbes -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- ── HEADER UNIVERSEL ── -->
  <header class="universal-header">
    <a class="header-brand" href="index.html">
      <div class="brand-icon">
        <img src="Page-demo/Image/logo_f.png"
          style="width: 100%; height: 100%; border-radius: 10%; object-fit: contain;" alt="Logo">
      </div>
      <span class="brand-name">Neural Playground</span>
    </a>

    <div class="header-right">
      <a class="btn-header" href="#"
        onclick="event.preventDefault(); window.location.href = localStorage.getItem('isLoggedIn') === 'true' ? 'Page-demo/exercises.html' : 'Page-demo/exercises.html';">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        Back to exercises page
      </a>

      <a class="btn-header" href="exo8.html"
        style="background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.5);">
        ⏮️ Previous exercise</a>

      <a class="btn-header" href="exo14.html"
        style="background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.5);">
        Next exercise ⏭️</a>

      <a class="btn-header" href="#" id="link-historique"
        onclick="event.preventDefault(); window.location.href = localStorage.getItem('isLoggedIn') === 'true' ? 'Page-demo/historique.html' : 'Page-demo/register.html';">
        My history </a>
      <div id="widget-profil-header" style="margin-left: 20px;"></div>
    </div>
  </header>

  <!-- NOUVEAU : BOUTONS D'ACTION EN BAS À DROITE -->
  <div class="exo-actions-footer">
    <button id="btn-sauvegarder" class="btn-action-premium" style="background-color: #004676;">
      <span class="icon">💾</span> Save draft
    </button>
    <button id="btn-realise" class="btn-action-premium btn-disabled" disabled>
      <span class="icon">✅</span> Exercise Successful !!
    </button>
  </div>

  <section class="exo-header">
    <div class="exo-toprow">
      <div class="badge">13</div>
      <h1 class="exo-title">Model complexity and features learning</h1>
    </div>

    <p class="exo-instructions">
      Review the iterative process of a neural network and Observe how data is transformed across deeper layers of the network.
    </p>
    </header>

    <main class="exo-main">
      <!-- ici on affiche le playground configuré exo=1 -->
      <iframe class="exo-frame" id="iframe-playground" src="./playground/index.html?exo=13"></iframe>
    </main>

    <!-- Overlay SVG pour le tracé des flèches dynamiques -->
    <svg id="arrow-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10005;">
      <defs>
        <marker id="arrow-head" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF034D" />
        </marker>
        <marker id="arrow-head-blue" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#004676" />
        </marker>
        <marker id="arrow-head-grey" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
          <path d="M 0 0 L 8 4 L 0 8 z" fill="rgba(148, 163, 184, 0.6)" />
        </marker>
      </defs>
    </svg>

    <!-- Script Widget Profil dynamique -->
    <!-- Ce script allows to manage l'inactivité de l'utilisateur : il redirige vers la page d'accueil après 10 minutes d'inactivité -->
    <script src="inactivite.js"></script>
    <script src="../playground-master/src/exos/storage_service.js"></script>
  <script src="../playground-master/src/exos/exo_common_oop.js"></script>
    <script src="../playground-master/src/exos/exo13_page.js"></script>
</body>

</html>
