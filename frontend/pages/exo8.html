<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercice 7</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles/exo.css" />
  <link rel="stylesheet" href="../styles/exo_quiz.css" />
  <style>
    html body main.quiz-layout-container .simulator-container {
      width: 50% !important;
    }
    html body main.quiz-layout-container .quiz-panel-container {
      width: 50% !important;
    }
  </style>
</head>

<body>


  <div id="background-container"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <header class="universal-header">
    <a class="header-brand" href="index.html">
      <div class="brand-icon">
        <img src="Page-demo/Image/logo_f.png" style="width: 100%; height: 100%; border-radius: 10%; object-fit: contain;" alt="Logo">
      </div>
      <span class="brand-name">Neural Playground</span>
    </a>

    <div class="header-right">
      <a class="btn-header" href="Page-demo/exercises.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        Back to exercises page
      </a>
      <a class="btn-header" href="exo7.html" style="background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.5);">⏮️ Previous exercise</a>
      <a class="btn-header" href="exo9.html" style="background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.5);">Next exercise ⏭️</a>
      <a class="btn-header" href="Page-demo/historique.html">My history</a>
      <div id="widget-profil-header" style="margin-left: 20px;"></div>
    </div>
  </header>

  <div class="exo-actions-footer">
    <button id="btn-sauvegarder" class="btn-action-premium" style="background-color: #004676;">
      <span class="icon">💾</span> Save draft
    </button>
    <button id="btn-realise" class="btn-action-premium btn-disabled" disabled>
      <span class="icon">✅</span> Exercise Successful !!
    </button>
  </div>

  <section class="exo-header">
    <div class="exo-toprow">
      <div class="badge">7</div>
      <h1 class="exo-title">Model Instability and weigh initialization</h1>
    </div>
    <p class="exo-instructions">
      Observe how parameter changes affect model behavior.
    </p>
  </section>

  <main class="quiz-layout-container">
    <div class="simulator-container" style="display: flex; flex-direction: column; gap: 10px; height: 100%;">
      <iframe class="exo-frame" id="iframe-model1" src="./playground/index.html?exo=8&model=1" style="height: calc(50% - 5px); flex-shrink: 0;"></iframe>
      <iframe class="exo-frame" id="iframe-model2" src="./playground/index.html?exo=8&model=2" style="height: calc(50% - 5px); flex-shrink: 0;"></iframe>
    </div>
    <div class="quiz-panel-container">
      <div class="quiz-div-1" id="quiz-question-panel">
        <!-- Dynamically populated activity cards -->
      </div>
      <div class="quiz-div-2" id="quiz-feedback-panel">
        <!-- Dynamically populated explanation feedback bubbles -->
      </div>
    </div>
  </main>

  <script src="inactivite.js"></script>
  <script src="../playground-master/src/exos/storage_service.js"></script>
  <script src="../playground-master/src/exos/exo8_page.js"></script>
</body>
</html>
