<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercice 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/exo.css" />
  <link rel="stylesheet" href="../../styles/exo_quiz.css" />
  <style>
    /* Styling for the step card inside the quiz panel */
    .quiz-panel-container {
      overflow-y: auto !important;
      max-height: 100% !important;
      scroll-behavior: smooth;
    }

    .quiz-step-card {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 70, 118, 0.4);
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      gap: 15px;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .quiz-step-card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .quiz-step-card.active {
      border: 4px solid #065f46; /* Active border = dark green */
      background: rgba(0, 70, 118, 0.9); /* #004676 with transparency */
      box-shadow: 0 10px 30px rgba(6, 95, 70, 0.3);
      color: #ffffff;
    }

    .quiz-step-card.active .quiz-step-desc {
      color: #cbd5e1;
    }

    .quiz-step-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .quiz-step-badge {
      background: #FF034D;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(255, 3, 77, 0.3);
    }

    .quiz-step-card h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }

    .quiz-step-desc {
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
      margin: 0;
    }

    .quiz-step-preview {
      margin-top: 5px;
      background: rgba(11, 15, 26, 0.5);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    
    /* Green highlight style inside the iframe */
    .tutorial-highlight-box.green-highlight {
      border: 4px solid #065f46 !important;
      box-shadow: 0 0 25px rgba(6, 95, 70, 0.6) !important;
      animation: green-zoom-glow 1.5s infinite ease-in-out !important;
    }

    @keyframes green-zoom-glow {
      0% {
        transform: scale(1);
        box-shadow: 0 0 8px #065f46;
      }
      50% {
        transform: scale(1.02);
        box-shadow: 0 0 30px #065f46;
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 8px #065f46;
      }
    }
    
    /* Info tip and badge styles inside previews */
    .info-tip {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 5px;
    }
    
    .info-tip-pulse {
      background: #FF034D !important;
      animation: info-pulse 1.5s infinite alternate;
    }
    
    @keyframes info-pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 3, 77, 0.7); }
      100% { box-shadow: 0 0 0 8px rgba(255, 3, 77, 0); }
    }

    /* final quiz drag-and-drop overlay and modal styles */
    .dd-quiz-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 26, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    
    .dd-quiz-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    
    .dd-quiz-container {
      background: #004676;
      border: 2px solid #FF034D;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 900px;
      height: 85vh;
      color: #ffffff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      gap: 30px;
      box-sizing: border-box;
      position: relative;
    }
    
    .dd-quiz-left {
      width: 50%;
      height: 100%;
      overflow-y: auto;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding-right: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .dd-quiz-right {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      justify-content: space-between;
    }
    
    .dd-quiz-left h4 {
      margin: 0;
      color: #FF034D;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
    }
    
    .dd-quiz-left p {
      margin: 5px 0 0 0;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    
    .dd-quiz-title {
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      margin: 0;
      line-height: 1.4;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }
    
    .dd-slots-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .dd-slot {
      background: rgba(255, 255, 255, 0.03);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 2px;
      min-height: 56px;
      display: flex;
      align-items: center;
    }
    
    .dd-card {
      background: #ffffff;
      color: #0b0f1a;
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: 600;
      cursor: grab;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.3s, border-color 0.3s;
      border: 2px solid transparent;
      user-select: none;
      box-sizing: border-box;
    }
    
    .dd-card:active {
      cursor: grabbing;
    }
    
    .dd-card-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #FF034D;
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
      transition: background-color 0.3s;
    }
    
    .dd-card.correct {
      border-color: #10b981;
    }
    
    .dd-card.correct .dd-card-num {
      background: #10b981;
    }
    
    .dd-quiz-validate-btn {
      background: #FF034D;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(255, 3, 77, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .dd-quiz-validate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 3, 77, 0.5);
    }

    /* Success message, animation, loops and congrats badge */
    .success-message-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: center;
      margin-top: 10px;
    }

    .success-message-card h2 {
      margin: 0;
      font-size: 24px;
      color: #10b981;
      font-weight: 800;
    }

    .success-message-card p {
      margin: 0;
      font-size: 14px;
      color: #cbd5e1;
    }

    .anim-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.03);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }
    
    .anim-init {
      font-size: 13px;
      font-weight: bold;
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(11, 15, 26, 0.3);
    }
    
    .anim-step-row {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 450px;
      padding: 10px 15px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.3s ease;
      color: #94a3b8;
      box-sizing: border-box;
    }
    
    .anim-step-row.highlight {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }
    
    .anim-step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    
    .anim-step-row.highlight .anim-step-num {
      background: #10b981;
    }
    
    .anim-step-text {
      font-size: 13px;
      text-align: left;
    }

    .anim-step-text strong {
      color: #ffffff;
    }
    
    .anim-loop-arrow {
      color: #cbd5e1;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0.2;
      transition: all 0.3s ease;
      margin-top: 5px;
    }
    
    .anim-loop-arrow.highlight {
      opacity: 1;
      color: #FF034D;
    }
    
    .success-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      text-align: center;
      margin-top: 20px;
      animation: cardFadeIn 0.5s ease-out forwards;
    }
    
    .success-footer-badge {
      background: #FF034D;
      color: white;
      font-weight: bold;
      font-size: 14px;
      padding: 6px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(255, 3, 77, 0.3);
    }
    
    .success-footer-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .success-footer-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(16, 185, 129, 0.5);
    }
    
    .shake-error {
      animation: card-shake-err 0.5s ease;
      border-color: #FF034D !important;
      background: rgba(255, 3, 77, 0.1) !important;
    }
    
    @keyframes card-shake-err {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
  </style>
</head>
