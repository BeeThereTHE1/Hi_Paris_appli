<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚👩🏻‍🏫 Hi!Paris Playground</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/login.css">
</head>

<body>

  <!-- ── HEADER ── -->
  <header>
    <a class="header-brand" href="index.html">
      <div class="brand-icon">
        <img src="Page-demo/Image/logo_f.png"
          style="width: 100%; height: 100%; border-radius: 10%; object-fit: contain;" alt="Logo">
      </div>
      <span class="brand-name">Neural Playground</span>
    </a>

    <div class="header-right">
      <a class="btn-back" href="index.html">
        <span class="material-icons" style="font-size: 18px;">home</span> Home page
      </a>

      <div class="header-right">
        <!-- Integrated Translation Widget placeholder (hidden) -->
        <div id="google_translate_element" style="display: none !important;"></div>
      </div>
    </div>
  </header>
  <iframe class="video-background"
    src="https://www.youtube.com/embed/ZNJJ3wEmRb8?autoplay=1&mute=1&loop=1&playlist=ZNJJ3wEmRb8&controls=0&showinfo=0"
    frameborder="0" allow="autoplay; fullscreen"></iframe>


  <!-- Arrière-plan -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Carte principale (login removed; kept CTAs and exercise cards) -->
  <div class="card" role="main">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <img src="Page-demo/Image/logo_f.png"
          style="width: 100%; height: 100%; object-fit: contain; border-radius: inherit; filter: brightness(1); height: 100px;"
          alt="Logo">
      </div>
      <div class="logo-title">Hi! Paris Playground For Deep Neural Network</div>
      <div class="logo-sub">Browse the platform or create an account to enjoy all features.
      </div>
    </div>

    <!-- NOTE: Login form and related controls were removed as requested.
         Replaced with two simple CTAs to keep the page usable. -->
    <div style="text-align: center; margin: 18px 0;">
      <a class="btn-connect" href="Page-demo/exercises.html" style="text-decoration: none; display: inline-block; margin: 6px 8px; padding: 10px 20px;">
        📚 Browse exercises
      </a>
      <a class="btn-connect" href="Page-demo/register.html" style="text-decoration: none; display: inline-block; margin: 6px 8px; padding: 10px 20px;">
        ✏️ Create an account
      </a>
    </div>

    <!-- Séparateur -->
    <div class="sep">
      <div class="sep-line"></div>
      <span class="sep-txt">What would you like to do?</span>
      <div class="sep-line"></div>
    </div>

    <!-- Rectangles cliquables -->
    <div class="ex-grid">

      <!-- Choisir un exercice -->
      <div class="ex-card" id="ex-choose" role="button" tabindex="0" onclick="onCard('choose')"
        onkeydown="if(event.key==='Enter'||event.key===' ')onCard('choose')">
        <div class="ex-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
        </div>
        <div class="ex-title">Choose an<br>exercise</div>
        <div class="ex-desc">Browse the exercise library</div>
      </div>

      <!-- Create an exercise -->
      <div class="ex-card" id="ex-create" role="button" tabindex="0" onclick="window.location.href='create.html'"
        onkeydown="if(event.key==='Enter'||event.key===' ') window.location.href='create.html'">
        <div class="ex-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </div>
        <div class="ex-title">Create an<br>exercise</div>
        <div class="ex-desc">Design your own exercise</div>
      </div>

    </div>
  </div><!-- /card -->

  <!-- Removed profile widget script and login-related scripts -->
  <script>
    /* ─── Toast ─── */
    function toast(msg, color = '#6ee7b7') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.color = color;
      el.style.border = '1px solid ' + color + '55';
      el.style.background = color + '22';
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3200);
    }

    /* ─── Cartes d'exercice ─── */
    function onCard(type) {
      const el = document.getElementById(type === 'choose' ? 'ex-choose' : 'ex-create');
      if (!el) return;
      el.style.transform = 'scale(.93)';

      if (type === 'choose') {
        toast('📚 Opening the exercise library…', '#60a5fa');
        setTimeout(() => {
          window.location.href = 'Page-demo/exercises.html';
        }, 400);
      } else {
        toast('✏️ Opening the exercise editor…', '#a78bfa');
        setTimeout(() => {
          window.location.href = 'create-exercise.html';
        }, 400);
      }
    }
  </script>
</body>

</html>
