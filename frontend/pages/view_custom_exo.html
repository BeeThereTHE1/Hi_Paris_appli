<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./exo.css">
    <link rel="stylesheet" href="../styles/view_custom_exo.css">

</head>

<body>


    <header class="preview-header">
        <div>
            <span class="preview-badge">Preview Mode</span>
            <h1 id="exo-title" style="margin:5px 0 0 0; font-size:18px; color:white;">Loading...</h1>
        </div>
        <button onclick="window.history.back()"
            style="background:rgba(255,255,255,0.1); color:white; border:1px solid rgba(255,255,255,0.2); padding:8px 20px; border-radius:8px; cursor:pointer; font-weight:600;">
            Back to history</button>
    </header>

    <iframe id="playground-frame" class="main-view"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const exoId = urlParams.get('id');

        if (exoId) {
            // Chercher dans toutes les sources possibles (pending, official, etc.)
            const allPending = JSON.parse(localStorage.getItem('pending_validations') || '[]');
            const allOfficial = JSON.parse(localStorage.getItem('official_custom_exercises') || '[]');

            // Removed login dependency: use generic keys instead of per-user keys based on currentUser/email
            const mySaved = JSON.parse(localStorage.getItem('saved_exercises') || '[]');
            const mySubmits = JSON.parse(localStorage.getItem('submitted_exercises') || '[]');

            let allExos = [...allPending, ...allOfficial, ...mySaved, ...mySubmits];
            let exo = allExos.find(e => e && String(e.id).trim() === String(exoId).trim());

            // Fallback : recherche agressive dans TOUT le localStorage si non trouvé
            if (!exo && exoId) {
                Object.keys(localStorage).forEach(key => {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (Array.isArray(data)) {
                            const found = data.find(e => e && String(e.id).trim() === String(exoId).trim());
                            if (found) {
                                exo = found;
                            }
                        }
                    } catch (err) { }
                });
            }

            if (exo) {
                document.getElementById('exo-title').innerText = exo.title || "Custom exercise";

                const iframe = document.getElementById('playground-frame');
                const hash = exo.hash || '';
                const css = exo.css || '';

                iframe.src = 'preview_index.html' + hash;
                iframe.onload = () => {
                    iframe.contentWindow.postMessage({ type: 'update-css', css: css }, '*');
                };
            } else {
                alert("Exercise not found.");
            }
        }
    </script>

    <!-- Ce script allows to manage l'inactivité de l'utilisateur : il redirige vers la page d'accueil après 10 minutes d'inactivité -->
    <script src="inactivite.js"></script>
</body>

</html>
